# Surface Duo : le profil automatique ne crée pas d'entrée ; source explicite sur la capture MultiMedia1 (hw:0,0).
# Le DSP n'accepte que 16 bits / 48 kHz, un seul canal (SLIM_0_TX One). Chemin mixeur : /usr/local/sbin/duo-micro.
context.objects = [
  { factory = adapter
    flags = [ nofail ]
    args = {
      factory.name = api.alsa.pcm.source
      node.name = "duo-micro"
      node.description = "Micro du Surface Duo"
      node.nick = "Micro"
      media.class = "Audio/Source"
      api.alsa.path = "hw:0,0"
      audio.format = "S16LE"
      audio.rate = 48000
      audio.channels = 1
      audio.position = [ MONO ]
      api.alsa.disable-mmap = true
      api.alsa.disable-batch = true
      priority.session = 2000
      priority.driver = 2000
      node.suspend-on-idle = true
      api.alsa.period-size = 1024
      api.alsa.headroom = 1024
      node.driver = true
      node.group = "duo-micro"
    }
  }
]
