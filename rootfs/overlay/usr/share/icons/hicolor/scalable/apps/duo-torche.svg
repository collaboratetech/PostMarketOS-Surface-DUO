<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="6 8 116 116">
  <!-- Icône « Lampe torche » du Surface Duo, même style que l'icône caméra (palette GNOME Adwaita) -->
  <defs>
    <linearGradient id="corps" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="0.5" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#3d3846"/>
    </linearGradient>
    <radialGradient id="faisceau" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#f9f06b" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#f6d32d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f6d32d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- faisceau -->
  <path d="M44 46 L18 10 H110 L84 46 Z" fill="url(#faisceau)"/>
  <!-- tête de la lampe -->
  <path d="M38 44 h52 l-8 22 h-36 z" fill="#241f31"/>
  <path d="M38 42 h52 l-8 22 h-36 z" fill="url(#corps)"/>
  <rect x="38" y="38" width="52" height="8" rx="3" fill="#deddda"/>
  <ellipse cx="64" cy="40" rx="22" ry="2.5" fill="#fff8b0"/>
  <!-- manche -->
  <rect x="47" y="64" width="34" height="50" rx="7" fill="#241f31"/>
  <rect x="47" y="62" width="34" height="48" rx="7" fill="url(#corps)"/>
  <!-- bouton -->
  <rect x="58" y="74" width="12" height="16" rx="4" fill="#e01b24"/>
  <rect x="60" y="76" width="8" height="5" rx="2" fill="#ffffff" opacity="0.35"/>
  <!-- stries de prise -->
  <path d="M52 96 h24 M52 101 h24" stroke="#241f31" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
