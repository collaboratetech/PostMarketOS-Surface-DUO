---
# Surface Duo : clavier de PC AZERTY complet, utilisé en paysage (mode portable : écran du bas).
# Largeur de chaque rangée = 15 unités (unité = 40) pour un alignement de vrai clavier.
outlines:
    default:   { width: 40,  height: 52 }
    esc:       { width: 80,  height: 52 }
    bksp:      { width: 80,  height: 52 }
    tab:       { width: 80,  height: 52 }
    caps:      { width: 80,  height: 52 }
    enter:     { width: 80,  height: 52 }
    shift:     { width: 100, height: 52 }
    up:        { width: 60,  height: 52 }
    mod:       { width: 80,  height: 52 }
    space:     { width: 160, height: 52 }

views:
    base:
        - "Esc 1 2 3 4 5 6 7 8 9 0 ° BackSpace"
        - "Tab a z e r t y u i o p é è -"
        - "Verr q s d f g h j k l m ù Return"
        - "Maj < w x c v b n , ; : ! Up"
        - "Ctrl Alt Symb space à ç Left Down Right"
    upper:
        - "Esc & é guill apos ( - è _ ç à ) BackSpace"
        - "Tab A Z E R T Y U I O P É È +"
        - "VerrOn Q S D F G H J K L M % Return"
        - "MajOn > W X C V B N ? . / § Up"
        - "Ctrl Alt Symb space À Ç Left Down Right"
    symbols:
        - "Esc ~ # { [ | ` backslash ^ @ ] } BackSpace"
        - "Tab € £ $ * + = ( ) ê â î ô û"
        - "Verr ë ï ü œ æ « » … ’ – — Return"
        - "Maj Inser Suppr Debut Fin PgPrec PgSuiv F1 F4 F5 F11 F12 Up"
        - "Ctrl Alt Lettres space Echap TabT Left Down Right"

buttons:
    Esc:
        outline: "esc"
        keysym: "Escape"
        label: "Éch"
    Echap:
        keysym: "Escape"
        label: "Éch"
    BackSpace:
        outline: "bksp"
        icon: "edit-clear-symbolic"
        action: "erase"
    Tab:
        outline: "tab"
        keysym: "Tab"
        label: "Tab"
    TabT:
        keysym: "Tab"
        label: "⇥"
    Verr:
        outline: "caps"
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        label: "Verr"
    VerrOn:
        outline: "caps"
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        label: "VERR"
    Maj:
        outline: "shift"
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        icon: "key-shift"
    MajOn:
        outline: "shift"
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        icon: "key-shift"
    Return:
        outline: "enter"
        icon: "key-enter"
        keysym: "Return"
    Ctrl:
        outline: "mod"
        modifier: "Control"
        label: "Ctrl"
    Alt:
        outline: "mod"
        modifier: "Alt"
        label: "Alt"
    Symb:
        outline: "mod"
        action:
            locking:
                lock_view: "symbols"
                unlock_view: "base"
        label: "@#"
    Lettres:
        outline: "mod"
        action:
            set_view: "base"
        label: "abc"
    space:
        outline: "space"
        text: " "
    Up:
        outline: "up"
        keysym: "Up"
        label: "↑"
    Left:
        keysym: "Left"
        label: "←"
    Down:
        keysym: "Down"
        label: "↓"
    Right:
        keysym: "Right"
        label: "→"
    Inser:
        keysym: "Insert"
        label: "Inser"
    Suppr:
        keysym: "Delete"
        label: "Suppr"
    Debut:
        keysym: "Home"
        label: "Début"
    Fin:
        keysym: "End"
        label: "Fin"
    PgPrec:
        keysym: "Page_Up"
        label: "Pg↑"
    PgSuiv:
        keysym: "Page_Down"
        label: "Pg↓"
    F1:
        keysym: "F1"
    F4:
        keysym: "F4"
    F5:
        keysym: "F5"
    F11:
        keysym: "F11"
    F12:
        keysym: "F12"
    guill:
        text: "\""
        label: "\""
    apos:
        text: "'"
        label: "'"
    backslash:
        text: "\\"
        label: "\\"
