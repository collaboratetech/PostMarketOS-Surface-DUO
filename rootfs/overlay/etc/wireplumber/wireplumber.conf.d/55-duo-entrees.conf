# Surface Duo : l'entrée automatique (profil ACP, stéréo) entre en conflit avec le micro réel ;
# on ne garde que la source « Micro du Surface Duo » (pipewire.conf.d/60-duo-micro.conf).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.*" } ]
    actions = { update-props = { node.disabled = true } }
  }
]
